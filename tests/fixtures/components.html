<!doctype html><html lang="en"><meta charset="utf-8"><title>Component library verification</title>
<style>*{box-sizing:border-box}body{margin:0;background:#333f38;color:#ede0ba;font:14px system-ui}h1{margin:20px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;padding:12px}article{background:#6b7162;border:1px solid #a79e7d;border-radius:8px;text-align:center;overflow:hidden}article canvas{display:block;width:100%;height:125px}article span{display:block;padding:7px}#render{display:none}</style>
<h1>Reusable components / developer test fixture</h1><div id="grid"></div><script type="module">
import * as T from '/src/campaign/engine/three.js';
import {presets,componentSpec,createComponent,ComponentWorld} from '/src/campaign/components/index.js';
import {ComponentScene} from '/src/campaign/components/visual/ComponentScene.js';
import {ComponentView} from '/src/campaign/components/visual/ComponentView.js';
import {makeMaterials} from '/src/campaign/visual/materials.js';
const errors=[],materials=makeMaterials(),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(260,180);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;
const camera=new T.PerspectiveCamera(35,260/180,.1,100);camera.position.set(2.8,2.5,3.5);camera.lookAt(0,.6,0);
for(const preset of Object.keys(presets)){
 const article=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=260;canvas.height=180;article.append(canvas);
 const label=document.createElement('span');label.textContent=preset;article.append(label);document.querySelector('#grid').append(article);
 try{
  const e=createComponent(componentSpec(preset,preset)),scene=new T.Scene();scene.background=new T.Color('#858775');
  scene.add(new T.HemisphereLight('#ffe6b8','#323e39',3));const light=new T.DirectionalLight('#fff1cd',3);light.position.set(3,5,4);scene.add(light);
  const view=new ComponentView(scene,materials,e),world=new ComponentWorld([e]);world.tick(.05);view.update(.05,1,world);
  const box=new T.Box3().setFromObject(view.root),size=box.getSize(new T.Vector3());
  if(!['ride','sequence'].includes(preset)&&size.length()===0)throw new Error('Empty visual: '+preset);
  e.state.powered=true;e.state.lit=true;e.state.direction=0;view.update(.05,2,world);
  renderer.render(scene,camera);canvas.getContext('2d').drawImage(renderer.domElement,0,0);
  view.dispose();if(scene.children.includes(view.root))throw new Error('View was not removed');
 }catch(error){errors.push(preset+': '+error.message);article.dataset.error=error.message;}
}
try{
 const scene=new T.Scene(),world=new ComponentWorld([createComponent(componentSpec('mains','source')),createComponent(componentSpec('fan','fan'))]);world.connect('source','fan');
 const view=new ComponentScene(scene,materials,world);world.tick(.1);view.update(.1,1);renderer.render(scene,camera);view.dispose();
 if(scene.children.length)throw new Error('Scene owner did not clean up');
}catch(error){errors.push('ComponentScene: '+error.message);}
renderer.dispose();window.fixtureResult={count:Object.keys(presets).length,errors};
</script></html>
